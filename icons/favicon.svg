<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#3b1d7a"/>
      <stop offset="55%" stop-color="#1a1440"/>
      <stop offset="100%" stop-color="#0f0c24"/>
    </radialGradient>
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="6" y1="8" x2="58" y2="56">
      <stop offset="0%" stop-color="#ffd60a"/>
      <stop offset="55%" stop-color="#f72585"/>
      <stop offset="100%" stop-color="#4cc9f0"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- scales of justice -->
  <g fill="none" stroke="url(#metal)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- vertical post -->
    <line x1="32" y1="12" x2="32" y2="48"/>
    <!-- top finial -->
    <circle cx="32" cy="10" r="2.4" fill="url(#metal)" stroke="none"/>
    <!-- crossbar -->
    <line x1="15" y1="18" x2="49" y2="18"/>
    <!-- left chains -->
    <line x1="15" y1="18" x2="9" y2="30"/>
    <line x1="15" y1="18" x2="21" y2="30"/>
    <!-- right chains -->
    <line x1="49" y1="18" x2="43" y2="30"/>
    <line x1="49" y1="18" x2="55" y2="30"/>
    <!-- left pan -->
    <path d="M6,30 Q15,40 24,30"/>
    <!-- right pan -->
    <path d="M40,30 Q49,40 58,30"/>
    <!-- base -->
    <line x1="22" y1="48" x2="42" y2="48"/>
    <line x1="20" y1="53" x2="44" y2="53"/>
  </g>
</svg>
